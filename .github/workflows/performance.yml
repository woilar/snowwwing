name: Performance regression checks
on:
  push:
    branches: [feature/reduce-cpu]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Compile and run behavioral checks
        run: zsh build.sh
