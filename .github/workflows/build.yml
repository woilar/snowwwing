name: macOS build
on:
  push:
    branches: [main, feature/sparkle-updates]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build both architectures and run self-tests
        run: zsh build.sh
      - name: Verify universal executable
        run: lipo -verify_arch arm64 x86_64 "build/Winter Desktop.app/Contents/MacOS/WinterDesktop"
