name: macOS build
on:
  push:
    branches: [main, feature/sparkle-updates]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Check release script syntax
        run: zsh -n scripts/prepare-update.sh
      - name: Build both architectures and run self-tests
        run: zsh build.sh
      - name: Verify universal executable
        run: lipo "build/Winter Desktop.app/Contents/MacOS/WinterDesktop" -verify_arch arm64 x86_64
